services:
  krakend:
    image: krakend/krakend-ee:3.0
    volumes:
      - .:/etc/krakend
    ports:
      - "8080:8080"
    command: [ "run", "-dc", "krakend.json" ]
    depends_on:
      - my_service
  my_service:
    image: busybox:1.37
    volumes:
      - ./data:/www
    command: ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
    ports:
      - "8000:8080"
