services:
  krakend_ee:
    image: krakend/krakend-ee:3.0
    init: true
    volumes:
      - ./config/krakend:/etc/krakend
      - ./LICENSE:/etc/krakend/LICENSE
    ports:
      - "8080:8080"
    command: ["run", "-d", "-c", "krakend.json"]
    depends_on:
      - restcountries
  restcountries:
    # Mock of the retired REST Countries v3.1 API, with a few countries
    build: ./images/restcountries-mock
    ports:
      - "8081:8080"
