services:
  krakend:
    image: krakend/krakend-ee:3.0
    volumes:
      - .:/etc/krakend
    ports:
      - "8080:8080"
    command: [ "run", "-dc", "krakend.json" ]
    depends_on:
      - ws_service
  ws_service:
    build: ./websocket_server/
    volumes:
      - ./websocket_server/server.cjs:/app/server.cjs
    ports:
      - "5678:5678"
